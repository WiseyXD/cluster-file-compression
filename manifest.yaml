
# ---------------- Input ConfigMap ----------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: huffman-input
data:
  input.txt: |
    The binomial coefficient is a fundamental concept in combinatorics and probability theory.
    It represents the number of ways to choose k elements from a set of n elements without regard to order.
    The formula is: n! / (k! * (n-k)!)
    This text demonstrates distributed Huffman compression across multiple worker nodes.
    Each worker counts character frequencies locally, then they synchronize via ZooKeeper.
    A leader merges all frequency tables, and every worker uses the same Huffman tree for encoding.
    Compression efficiency depends on character frequency distribution in the input text.

---
# ---------------- ZooKeeper ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.8
          ports:
            - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

# ---------------- Worker ----------------
---
apiVersion: batch/v1
kind: Job
metadata:
  name: huffman-worker
spec:
  completions: 2
  parallelism: 2
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: huffman-worker
    spec:
      restartPolicy: Never

      # ⬇️ WAIT FOR ZOOKEEPER AND API
      initContainers:
        - name: wait-for-zookeeper
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for ZooKeeper..."
              until nc -z zookeeper 2181; do
                sleep 2
              done
              echo "ZooKeeper is ready"
        - name: wait-for-api
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for API..."
              until nc -z huffman-api 8080; do
                sleep 2
              done
              echo "API is ready"

      containers:
        - name: worker
          image: distributed-huffman:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: input-volume
              mountPath: /data

      volumes:
        - name: input-volume
          configMap:
            name: huffman-input

# ---------------- API ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huffman-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huffman-api
  template:
    metadata:
      labels:
        app: huffman-api
    spec:
      containers:
        - name: api
          image: huffman-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: huffman-api
spec:
  selector:
    app: huffman-api
  ports:
    - port: 8080
      targetPort: 8080
